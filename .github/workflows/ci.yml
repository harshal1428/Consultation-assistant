name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # CI must never download or run a speech model.
      ASR_BACKEND: fake
      DEV_TOOLS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_VOICE_MODE: server
      VITE_VOICE_AUTOAPPLY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Gold live-decision fixture
        working-directory: frontend
        run: npx vitest run tests/goldLiveDecisions.test.ts
      - name: Fixture must be committed and current
        run: git diff --exit-code -- backend/tests/gold/live_decisions.json
      - name: Voice and live tests
        working-directory: frontend
        run: >
          npx vitest run
          tests/goldLiveDecisions.test.ts
          tests/live.test.ts
          tests/LiveSimulationPanel.test.tsx
          tests/useVoiceCapture.test.tsx
      - name: Build
        working-directory: frontend
        run: npm run build
